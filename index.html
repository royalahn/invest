<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest Insight - 투자 인사이트 허브</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    
    <!-- Fonts and Icons -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        mono: ['"Cascadia Mono"', 'Pretendard', 'monospace'],
                    },
                    colors: { 
                        gray: { 900: '#0f1115', 800: '#161b22', 700: '#21262d' } 
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: { 
                            '0%, 100%': { transform: 'translateY(0)' }, 
                            '50%': { transform: 'translateY(-20px)' } 
                        },
                        fadeInUp: { 
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-header {
            background: rgba(15, 17, 21, 0.7); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background: linear-gradient(to right, #0ea5e9, #6366f1, #a855f7);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        .dark .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        .glow-bg {
            position: absolute; 
            width: 100%; 
            max-width: 800px;
            height: 800px; 
            z-index: -1; 
            pointer-events: none;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            top: -300px; 
            left: 50%; 
            transform: translateX(-50%); 
            transition: all 0.5s ease;
        }
        .dark .glow-bg {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(15, 17, 21, 0) 70%);
        }
        .reveal { 
            opacity: 0; 
            transform: translateY(30px); 
            transition: all 0.8s ease-out; 
        }
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }
        .category-filter {
            transition: all 0.2s ease;
        }
        .category-filter.active {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white antialiased transition-colors duration-300 min-h-screen relative overflow-x-hidden">

    <!-- Glow Background -->
    <div class="glow-bg"></div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 glass-header transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-400 to-indigo-500 flex items-center justify-center text-white shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                    Invest <span class="gradient-text">Insight</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="https://github.com/royalahn/invest" target="_blank" class="hidden sm:flex w-10 h-10 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors shadow-sm">
                    <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"></path></svg>
                </a>
                <button id="theme-toggle" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors shadow-sm">
                    <i id="theme-icon" class="fa-solid fa-moon text-gray-600 dark:text-gray-300"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
        <!-- Hero Section -->
        <section class="text-center mb-16 reveal active">
            <span class="inline-block py-1 px-3 rounded-full bg-sky-50 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400 text-sm font-semibold mb-6 border border-sky-100 dark:border-sky-800">
                <i class="fa-solid fa-chart-line mr-1"></i> Investment Research Hub
            </span>
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight">
                투자 <span class="gradient-text">인사이트</span> 모음
            </h1>
            <p class="text-lg text-gray-500 dark:text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                종목 분석, 시장 동향, 투자 전략까지 — AI를 활용하여 작성된 투자 인사이트 리포트를 한 곳에서 편리하게 탐색해 보세요.
            </p>
            
            <!-- Search Bar -->
            <div class="max-w-xl mx-auto relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400 group-focus-within:text-sky-500 transition-colors"></i>
                <input type="text" id="search-input" placeholder="종목명, 키워드로 검색..." class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all text-gray-900 dark:text-white placeholder-gray-400">
            </div>
        </section>

        <!-- Category Filter -->
        <section class="mb-8 reveal active">
            <div class="flex flex-wrap gap-2 justify-center" id="category-filters">
                <button class="category-filter active px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:border-sky-400 dark:hover:border-sky-500" data-category="all">
                    <i class="fa-solid fa-layer-group mr-1"></i> 전체
                </button>
            </div>
        </section>

        <!-- Dynamic Catalog Grid -->
        <section>
            <div class="flex items-center gap-3 mb-8 reveal active">
                <i class="fa-solid fa-folder-open text-sky-500 text-xl"></i>
                <h2 class="text-2xl font-bold">인사이트 문서</h2>
                <div class="flex-grow h-px bg-gray-200 dark:bg-gray-800 ml-4"></div>
                <span id="doc-count" class="text-sm font-medium text-gray-500 dark:text-gray-400">0개의 문서</span>
            </div>

            <!-- This container will be populated by pages.json -->
            <div id="pages-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be injected here -->
            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="border-t border-slate-200 dark:border-gray-800 py-10 mt-auto bg-white dark:bg-gray-900/50">
        <div class="max-w-7xl mx-auto px-6 sm:px-12 lg:px-24 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 text-slate-600 dark:text-slate-400 text-sm font-medium">
                <i class="fa-solid fa-chart-line text-xl text-sky-500"></i>
                <span>&copy; 2026 Invest Insight. Open source project.</span>
            </div>
            <div class="text-slate-400 dark:text-slate-500 text-xs">
                Generated by AI Coding Assistant
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Theme toggle logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }

            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                    themeIcon.classList.replace('fa-sun', 'fa-moon');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                    themeIcon.classList.replace('fa-moon', 'fa-sun');
                }
            });

            // IntersectionObserver for reveal animations
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            // Data logic
            let allPages = [];
            let currentCategory = 'all';
            const container = document.getElementById('pages-container');
            const searchInput = document.getElementById('search-input');
            const docCount = document.getElementById('doc-count');
            const categoryFiltersContainer = document.getElementById('category-filters');

            // Category icon mapping
            const categoryIcons = {
                '종목분석': 'fa-solid fa-magnifying-glass-chart',
                '시장동향': 'fa-solid fa-chart-line',
                '투자전략': 'fa-solid fa-chess',
                '재무분석': 'fa-solid fa-calculator',
                '섹터리포트': 'fa-solid fa-industry',
                'ETF분석': 'fa-solid fa-chart-pie',
                '매크로': 'fa-solid fa-globe',
                '가이드': 'fa-solid fa-book',
            };

            // Category badge colors
            const categoryColors = {
                '종목분석': 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400',
                '시장동향': 'bg-sky-50 dark:bg-sky-900/30 text-sky-600 dark:text-sky-400',
                '투자전략': 'bg-violet-50 dark:bg-violet-900/30 text-violet-600 dark:text-violet-400',
                '재무분석': 'bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400',
                '섹터리포트': 'bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400',
                'ETF분석': 'bg-cyan-50 dark:bg-cyan-900/30 text-cyan-600 dark:text-cyan-400',
                '매크로': 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400',
                '가이드': 'bg-gray-50 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300',
            };

            function getFilteredPages() {
                const term = searchInput.value.toLowerCase();
                return allPages.filter(p => {
                    const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                    const matchesSearch = !term || 
                        p.title.toLowerCase().includes(term) || 
                        p.description.toLowerCase().includes(term) ||
                        (p.category && p.category.toLowerCase().includes(term));
                    return matchesCategory && matchesSearch;
                });
            }

            function renderPages(pagesToRender) {
                container.innerHTML = '';
                docCount.textContent = `${pagesToRender.length}개의 문서`;

                if (allPages.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full py-20 text-center bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-800/50 dark:to-gray-800/30 rounded-3xl border border-dashed border-gray-300 dark:border-gray-700 reveal active">
                            <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-sky-100 to-indigo-100 dark:from-sky-900/30 dark:to-indigo-900/30 flex items-center justify-center">
                                <i class="fa-solid fa-chart-line text-3xl text-sky-500 dark:text-sky-400"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-700 dark:text-gray-300 mb-2">아직 등록된 인사이트가 없습니다</h3>
                            <p class="text-gray-500 dark:text-gray-400 text-sm max-w-md mx-auto leading-relaxed">
                                <code class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded">ai-html/</code> 폴더에 새로운 투자 분석 문서를 추가하고<br>
                                <code class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded">pages.json</code>에 등록하면 여기에 표시됩니다.
                            </p>
                        </div>
                    `;
                    return;
                }

                if (pagesToRender.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full py-16 text-center bg-gray-100 dark:bg-gray-800/50 rounded-3xl border border-dashed border-gray-300 dark:border-gray-700 reveal active">
                            <i class="fa-solid fa-magnifying-glass text-4xl text-gray-400 mb-4"></i>
                            <p class="text-gray-500 dark:text-gray-400 text-lg">검색 결과가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                pagesToRender.forEach((page, index) => {
                    const card = document.createElement('a');
                    card.href = page.filename;
                    card.className = 'group block p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-sm hover:shadow-xl transition-all duration-300 transform hover:translate-y-[-5px] border border-gray-100 dark:border-gray-700 reveal';
                    card.style.transitionDelay = `${index * 50}ms`;

                    const badgeColor = categoryColors[page.category] || 'bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300';
                    const icon = categoryIcons[page.category] || 'fa-solid fa-file-lines';

                    const categoryBadge = page.category 
                        ? `<span class="px-3 py-1 text-xs font-semibold rounded-full ${badgeColor}">${page.category}</span>`
                        : '';

                    const dateInfo = page.date 
                        ? `<div class="text-xs font-medium text-gray-400 dark:text-gray-500 flex items-center gap-1.5"><i class="fa-regular fa-calendar"></i> ${page.date}</div>` 
                        : '';

                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-5">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-gray-50 to-gray-100 dark:from-gray-700 dark:to-gray-600 flex items-center justify-center text-gray-600 dark:text-gray-300 group-hover:scale-110 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-all shadow-sm">
                                    <i class="${icon} text-xl"></i>
                                </div>
                                ${categoryBadge}
                            </div>
                            <div class="w-8 h-8 rounded-full bg-gray-50 dark:bg-gray-700 flex items-center justify-center group-hover:bg-sky-500 group-hover:text-white text-gray-300 dark:text-gray-500 transition-colors">
                                <i class="fa-solid fa-arrow-right text-sm"></i>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2 group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors">${page.title}</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm line-clamp-2 mb-4 leading-relaxed">${page.description}</p>
                        ${dateInfo}
                    `;
                    container.appendChild(card);
                    observer.observe(card);
                });
            }

            function buildCategoryFilters() {
                const categories = [...new Set(allPages.map(p => p.category).filter(Boolean))];
                
                // Clear existing filters except "전체"
                categoryFiltersContainer.innerHTML = '';
                
                // Add "전체" button
                const allBtn = document.createElement('button');
                allBtn.className = 'category-filter active px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:border-sky-400 dark:hover:border-sky-500';
                allBtn.dataset.category = 'all';
                allBtn.innerHTML = '<i class="fa-solid fa-layer-group mr-1"></i> 전체';
                categoryFiltersContainer.appendChild(allBtn);

                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'category-filter px-4 py-2 rounded-full text-sm font-semibold border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:border-sky-400 dark:hover:border-sky-500';
                    btn.dataset.category = cat;
                    const icon = categoryIcons[cat] || 'fa-solid fa-tag';
                    btn.innerHTML = `<i class="${icon} mr-1"></i> ${cat}`;
                    categoryFiltersContainer.appendChild(btn);
                });

                // Add click handlers
                categoryFiltersContainer.querySelectorAll('.category-filter').forEach(btn => {
                    btn.addEventListener('click', () => {
                        categoryFiltersContainer.querySelectorAll('.category-filter').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentCategory = btn.dataset.category;
                        renderPages(getFilteredPages());
                    });
                });
            }

            try {
                const response = await fetch('pages.json?t=' + new Date().getTime());
                allPages = await response.json();
                buildCategoryFilters();
                renderPages(allPages);

                // Search Event
                searchInput.addEventListener('input', () => {
                    renderPages(getFilteredPages());
                });

            } catch (error) {
                console.error('Failed to load pages catalog:', error);
                container.innerHTML = `
                    <div class="col-span-full p-8 text-center bg-red-50 dark:bg-red-900/20 text-red-500 rounded-3xl border border-red-100 dark:border-red-800">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-3"></i>
                        <p class="font-medium">문서 목록을 불러오지 못했습니다.</p>
                        <p class="text-sm mt-1 opacity-80">pages.json 파일이 존재하고 유효한 형식인지, 로컬 웹 서버로 접속했는지 확인해주세요.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
